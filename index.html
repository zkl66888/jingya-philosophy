<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eee9">
  <title>京瓷哲学</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2a33;
      --muted: #64707a;
      --paper: #fffdf8;
      --edge: #e4ddd0;
      --accent: #0d6670;
      --accent-soft: #dcefeb;
      --background: #e9eee9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-width: 320px;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    }
    .reader {
      height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) clamp(14px, 4vw, 56px) max(18px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: 28px minmax(0, 1fr) 48px;
      gap: clamp(14px, 2vw, 22px);
    }
    .topline, .reader-footer {
      width: min(100%, 1100px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .book-name { font-size: 15px; font-weight: 700; }
    .author { color: var(--accent); font-size: 13px; font-weight: 700; }
    .book-page {
      width: min(100%, 900px);
      min-height: 0;
      margin: 0 auto;
      padding: clamp(28px, 6vw, 72px) clamp(24px, 9vw, 112px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--edge);
      border-radius: 4px;
      box-shadow: 0 18px 44px rgb(37 55 50 / 12%);
    }
    .chapter-number {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 25px;
      color: var(--accent);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 14px;
      font-weight: 700;
    }
    .chapter-number::before { width: 34px; height: 2px; content: ""; background: var(--accent); }
    h1 { margin: 0 0 30px; font-size: 34px; line-height: 1.35; font-weight: 700; }
    .content {
      max-width: 38em;
      padding: 0 16px 0 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      font-size: 19px;
      line-height: 2;
      scrollbar-color: #b7c8c3 transparent;
      scrollbar-width: thin;
    }
    .content p { margin: 0 0 1.25em; }
    .content p:last-child { margin-bottom: 0; }
    .reader-footer { gap: 16px; }
    .page-count { flex: 1; color: var(--muted); text-align: center; font-family: "Microsoft YaHei", sans-serif; font-size: 13px; }
    .page-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid #b4c7c2;
      border-radius: 50%;
      background: #f9fcfa;
      color: var(--accent);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 25px;
      line-height: 1;
    }
    .page-button:hover:not(:disabled), .page-button:focus-visible:not(:disabled) { background: var(--accent-soft); }
    .page-button:disabled { border-color: #d8dedc; color: #aeb8b5; cursor: not-allowed; }
    @media (max-width: 560px) {
      .reader { padding-left: 12px; padding-right: 12px; }
      .book-page { padding: 34px 26px; }
      h1 { margin-bottom: 24px; font-size: 27px; }
      .chapter-number { margin-bottom: 20px; }
      .content { padding-right: 8px; font-size: 17px; line-height: 1.9; }
    }
  </style>
</head>
<body>
  <main class="reader" aria-label="京瓷哲学电子书">
    <header class="topline">
      <div class="book-name">京瓷哲学</div>
      <div class="author">稻盛和夫</div>
    </header>
    <article class="book-page" aria-live="polite">
      <p id="chapter-number" class="chapter-number"></p>
      <h1 id="chapter-title"></h1>
      <div id="chapter-content" class="content" tabindex="0"></div>
    </article>
    <footer class="reader-footer">
      <button id="previous" class="page-button" type="button" aria-label="上一条" title="上一条">‹</button>
      <div id="page-count" class="page-count"></div>
      <button id="next" class="page-button" type="button" aria-label="下一条" title="下一条">›</button>
    </footer>
  </main>
  <script>
    const chapters = [{"number": 1, "title": "与“宇宙的意志“相协调", "paragraphs": ["观察世界万物：宇宙中物质的产生、生命的诞生以及进化的演绎，我们不得不认为，这些现象并不是偶然的产物，其中存在着必然性。", "在这个世界上，万物都有进化发展的趋势，这可称为”宇宙的意志“。宇宙的意志充满着爱、真诚以及和谐。所以，我们每个人的思维所发出的能量，与宇宙的意志是否协调，就决定了我们各自的命运。如果你拥有美好的心性，和宇宙的意志协调和谐，那么你的人生必将充满光明。"]}, {"number": 2, "title": "“爱、真诚及和谐之心”", "paragraphs": ["要在人生中、在工作中取得出色的成果，人的思维方式、人的心性起着决定性的作用。", "导致人们成功的是一颗好心，这颗好心用爱、真诚及和谐这些词汇来表达。我们人类在灵魂深处本来就拥有这样的好心。", "所谓“爱”，就是把别人的欢乐视为自己的欢乐。", "所谓“真诚”，就是总是想着为社会、为别人做些什么。", "所谓“和谐”，就是不仅希望自己，同时也希望身边所有的人都能得到幸福。从爱、真诚及和谐之心中所产生的思想，就是引导人们走向成功的基础。"]}, {"number": 3, "title": "以纯洁的心灵描绘愿望", "paragraphs": ["如果不以纯洁的心灵描绘愿望，就不会有卓越的成功。即使抱有强烈的愿望，如果这种愿望是出于私利私欲，那么也许能够带来一时的成功，但这种成功不可能长期持续下去。基于反社会的动机产生的愿望，结果只会带来更大的失败。要想使成功长期持续下去，描绘的愿望和焕发的热情必须是纯洁的。换言之，渗透到潜意识里的愿望纯洁与否，才是问题的关键。持有纯洁的愿望，坚持不懈地努力，那么愿望一定会实现。"]}, {"number": 4, "title": "拥有坦诚之心", "paragraphs": ["所谓坦诚之心，就是承认自己有不足，从而发奋努力的谦虚态度。有能力的人、性情急躁的人、自我意识强烈的人，往往不愿听取别人的意见，即使听了，也会反驳。", "但是，真正能够取得进步的人，是怀着坦诚之心、经常听取别人的意见、经常自我反省、能够正确认识自己的人。有了这样的坦诚之心，这个人的周围就会聚集同样心态的人。这样，力量就能凝聚起来，就能推动事业朝更好的方向前进。听起来刺耳的话，往往是对自己的发展有帮助的良言。虚心听取别人的意见，这种态度非常重要。"]}, {"number": 5, "title": "必须始终保持谦虚", "paragraphs": ["随着社会的不断发展，持有“自我中心”价值观的人，就是过分强调自我主张的人越来越多。抱有这种观念的人之间，必然会产生“自我”与“自我”的冲突。这样，需要团队间互相配合的工作就无法进展。", "陶醉于自己的能力或微不足道的成功，骄傲自满，就得不到周围人的帮助，并且妨碍自己的成长。为了形成团队合力，在和谐的气氛中有效地开展工作，必须意识到“有了大家才会有自己”，始终保持谦虚的态度，这是非常重要的。"]}, {"number": 6, "title": "怀有感谢之心", "paragraphs": ["企业内部如果缺乏和谐的人际关系，就无法制造出让顾客满意的产品。因为产品中蕴含着制造者的心。只为自己着想的利已主义者，无法营造出公司和谐的人际关系。", "我们能有今天，能尽情工作，离不开顾客、供应商、工作同事以及家人等周围人的支持，仅凭我们自己是不可能做到的。", "不要忘记周围人的帮助，对他们怀抱感谢之心，彼此成为互相信赖的伙伴，一起推动事业的发展，这才是最重要的。"]}, {"number": 7, "title": "保持乐观开朗", "paragraphs": ["不管身处何逆境，不管遭遇何种艰辛，始终保持乐观开朗的心态，满怀理想和希望，坚忍不拔，努力奋斗，这才造就了今天的京瓷。", "人生充满着光明和希望。“我一定会迎来辉煌的人生!”时刻抱有这样的信念十分重要。", "不要牢骚满腹，不要消沉郁闷，不要憎恨别人，不要妒忌别人。这类消极情绪将使人生黯淡无光。道理很简单，对自己的未来充满希望，乐观开朗，积极行动，这是促使人生和事业顺利发展的首要条件。"]}, {"number": 8, "title": "为伙伴尽力", "paragraphs": ["在人的行为中，最值得敬佩和最为美好的便是利他行为。人们往往倾向于首先考虑自身的得失，但其实人们同时也具有把“为他人做贡献、为他人带去欢乐“作为人生最高幸福的利他之心。", "曾经有一起发生在美国的空难，当时正值严冬，一位男士在自己将要获救的瞬间，竟然把求生的机会让给了旁边一位奄奄一息的女士，而自己则沉入了水底。人类的本性就是有如此美丽的一面。", "我们企业家也一样，必须具有为伙伴、光同事做奉献的牺牲精神，只有不吝于帮助他人，才能打造优秀的团队。"]}, {"number": 9, "title": "构筑信赖关系", "paragraphs": ["京瓷自创业以来，就把同事之间心心相联的密切关系做为经营的基础，员工彼此间怀着感激和诚意，在互相依赖的基础之上开展工作。公司一贯重视酒话会等各种各样的集体活动，以此为全体员工提供敞开心扉、增进交流的机会。", "即使是上下级，只要有信赖关系做基础，相互间就可以坦诚交流，说出真实的想法。这样一来，问题就会一目了然，工作就会顺利进展。", "构筑这样的信赖关系，需要在平时不断做出努力，把大家的心紧密地联系起来。"]}, {"number": 10, "title": "贯彻完美主义", "paragraphs": ["在90%顺利进展的情况下，有人就会自满：“这已经不错了吧!”从而停止努力。这样的人，最终做不出“可以划破手的”完美无缺的产品。“写错了，用橡皮擦掉就行!”如果心存这种马虎的念头，就不可能取得让自己、让旁人真正满意的成果。", "销售也好、生产也好，如果放松了最后1%的努力，就有可能失去订单，或造出不良品。", "想要让自己的努力结出更大的成果，就必须在工作中不断追求完美。"]}, {"number": 11, "title": "认真努力，埋头苦干", "paragraphs": ["认真工作，意味着勤奋，意味着是对工作始终抱有诚实的态度。", "我们从心底品尝到真正的快乐，就在工作之中。对工作漫不经心，而想从娱乐和兴趣中寻求快乐，结果可能会有一时的快感，但决不会获得真正的喜悦。", "如果不能从占人生比重最大的工作中获取充实感，那么，我们必将感到空虚和不足。", "只有在认真努力、埋头苦干并有所成就时，我们才能体味到其他任何东西都无法替代的、真正的欢喜和快乐。"]}, {"number": 12, "title": "脚踏实地，坚持不懈", "paragraphs": ["怀有远大的理想和愿望固然很重要，但是，即使树立了远大的目标，在日常工作中，却必须要做许多看起来简单乏味的事。“自己的梦想和现实之间的差距太大了!”有时我们会感到苦恼。", "可是，在任何领域，在取得丰硕的成果之前，都必须对工作进行改良改善，必须做基础性试验、收集数据，必须四处奔走争取订单，必须脚踏实地，努力工作，反反复复，精益求精。不要忘记，伟大的事业不是一下子就可能实现的，而是靠脚踏实地的努力和一步一步的积累。"]}, {"number": 13, "title": "自我燃烧", "paragraphs": ["正如物质可以分为可燃物、不燃物和自燃物一样，人也有三种类型：点火就燃烧的可燃型的人，点火也不会燃烧的不燃型的人，以及靠自己就可以熊熊燃烧的自燃型的人。", "要想成就一番事业，必须具有自我燃烧的热情。高中棒球队那些从内心里热爱棒球的年轻人，以进军甲子园球场为目标，齐心协力，满怀热情的投入训练。从他们的身影中，就能感受到未来的希望和蓬勃的活力。他们是能够自我燃烧的自燃型的团队。要想自我燃烧，除了要热爱自己所从事的工作之外，同时还要抱有明确的目标。"]}, {"number": 14, "title": "爱上工作", "paragraphs": ["要把工作做得完美，需要巨大的能量。这种能量靠自我激励、自我燃烧产生出来。", "而自我燃烧最好的办法，就是要爱上工作。", "任何工作，只要全身心投入并取得成功，就会获得巨大的成就感并产生自信，进而萌生向下一个目标挑战的欲望。在这样反复的过程中，你就会更加热爱工作。这种状态下，任何努力也不会觉得辛苦，就能孕育出优异的成果。只有把心态提升到这样的境界，才能在工作中取得辉煌的成功。"]}, {"number": 15, "title": "探究事物的本质", "paragraphs": ["只有彻底究明一事一物，我们才能体悟到真理，才能理解事物的本质。所谓彻底究明，就是全身心投入到一件事物上，抓住其中的核心。有了对一事一物探明本质的深刻体验，就可以触类旁通，运用到所有的事物中去。即使看起来是枯燥无味的事情，也要把它看作是上苍赋予自己的天职，倾注自己的全部心血，这样锲而不舍，不懈努力，真理一定会显现。", "一旦明白了事物的真理，那么不管做什么，不管身处何种环境，都可以自由地、尽情地发挥出自己的力量。"]}, {"number": 16, "title": "成为旋涡的中心", "paragraphs": ["自己一个人单枪匹马做不好工作，必须马上与上级、部下，以及周围的人互相配合，齐心协力，工作才能做好。在这种情况下，自己首先要主动积极地寻找并承担工作，这样，周围的人自然而然就会来协助你，你就能”在旋涡的中心工作“。", "公司里到处都翻卷着工作的旋涡。如果总是以别人为中心，自己只是在外围跟着打转，自己总是处在协助的位置，那就体会不到工作真正的乐趣。在工作中，自己要成为旋涡的中心，积极地把周围的人卷挟进来。"]}, {"number": 17, "title": "率先垂范", "paragraphs": ["在工作上想得到部下和周围人的帮助，自己必须率先垂范。哪怕是别人都讨厌的工作，自己也要一马当先，采取积极挑战的态度。", "无论堆砌多少令人动听的辞藻，如果自己不带头执行，就不能抓住人心。想让别人做的事，首先自己要冲在前面，用行动做出表率，这样，周围的人才会追随你。率先垂范需要勇气和信念，但是只要不断地用心实践，就能够自我提升。不仅领导者，公司里所有的人也都应该共同营造率先垂范的风气。"]}, {"number": 18, "title": "把自己逼入绝境", "paragraphs": ["即使遭遇困难，也决不逃避。当你陷人困境、苦苦挣扎时，如果抱有“无论如何也必须成功”的紧迫感，就会发现平时忽视的现象，从而找到解决问题的线索。人们常说“火灾现场的爆发力”这句话。当人被逼入绝境", "时，只要抱着诚实的态度，正视现实，迎难而上，就能发挥出平时难以想象的力量，绝处逢生。", "人往往趋向于避难就易，因此，要时时有意识地把自己逼人后无退路的精神状态，这样就能够催生出连自己都惊讶的成果。"]}, {"number": 19, "title": "在相扑台的中央发力", "paragraphs": ["“在相扑台的中央发力”，指的是把相扑台的申央视作边界，一开始就寸步不让。要用这样的心态对待工作。以交货期为例，不是按照客户要求的交货期安排生产，而把完成日期设定在交货期之前的若干天，将其作为“相扑台的边界”，使出泽身解数，竭尽全力遵守交货期。这样，即使发生意外的情况，因为离“相扑台边界”还有余地，就能够从容地采取应对措施，避免给客户带来麻烦。我们必须设置这样的“安全阀”，切切实实推进工作。"]}, {"number": 20, "title": "直言相谏", "paragraphs": ["为了以负责的态度做好工作，与工作相关的人们，要毫不客气地互相指出发现的缺点和问题。", "做事不能“和稀泥”，不能敷行马虎。必须时时以“何谓正确”为基准，认真讨论，直言相告。发现了缺点和问题，却因担心被他人讨厌而不敢大胆指出，保持一团和气，这就大错特错了。", "哪怕发生唾沫横飞的激烈争论，也要拿出勇气，互相说实话，真心相碰，这点十分重要。只有这样，才能建立起真正意义上的相互信赖的关系，才能把工作做得更加出色。"]}, {"number": 21, "title": "戒除私心才能正确的判断", "paragraphs": ["在做出某项决定的时候，哪怕夹杂些许私心，都会影响判断的正确性，结果就会导致错误和失策。", "人心往往偏向于利己。如果大家都把对对方的关心和体谅抛在脑后，而把“私”字放在首位，那么就得不到周围人的帮助，工作也不可能顺利推进。而且，这样的想法，会使团队的道德衰退，活力减弱。", "在日常工作中，我们要抑制“只要自己好就行”的利己心，在判断事情时，经常自问自答：自己做人是否正确，是否夹杂着私心。"]}, {"number": 22, "title": "具备均衡的人格", "paragraphs": ["所谓“均衡的人格”，一方面，对待事情都要问一个“为什么?”讲究逻辑和理性，彻底追求和探明事物的真相。另一方面，又要富于人情味，与任何人都能友好相处。", "仅凭卓越的分析能力和理性的行动能力，并不能获得周围人由衷的协助。反过来，只是被大家公认的老好人，也不能有力地推进工作。为了把工作做得有声有色，在具备科学家的合理性的同时，还必须兼备人格魅力，让人们心甘情愿为你赴汤蹈火。"]}, {"number": 23, "title": "实践重于知识", "paragraphs": ["“知道”和“做到”完全是两回事。从测算陶瓷烧制收缩率的例子中，我们就能清楚地理解到这一点。根据文献上的知识，在相同的条件下烧结，实际结果却每次都不一样。就是说，书本上的知识和理论，和实际发生的现象并不相同。只要通过亲身实践的验证，也就是说，只有通过亲身体验，才能看清事物的本质。这个道理对于销售部门也好，管理部门也好，完全适用。只有亲身体验，才能把知识和理论用好用活。"]}, {"number": 24, "title": "要不断从事创造性的工作", "paragraphs": ["把交给自己的工作作为终生的事业，拼命努力做好，这一点很重要。但仅仅这样还不够，更重要的是在努力工作的同时，还要每天思考，每天反省，“这样做已经足够了吗?”并不断改善改进。决不能漫不经心地重复与昨天相同的工作。", "在每天的工作中，要经常思考“有没有更好的方法呢?”同时，带着“为什么”的疑问，今天要比昨天好，明天要比今天好。对于交给自己的工作，要不断思考如何改善改进。这样反复钻研，就会发展成为有创造性的工作。重复这样的过程，就能带来巨大的进步。"]}, {"number": 25, "title": "把利他之心作为判断基准", "paragraphs": ["在我们每个人的心里，既有“只要对自己有利就行”的利己心，也有“即便牺牲自己也要帮助他人”的利他心。仅凭利已之心判断事物，因为只考虑自己的利害得失，所以无法得到别人的帮助。同时，只以自我为中心，因此视野狭窄，容易做出错误的判断。相反，以利他之心做判断，因为是“为他人好”，所以能够获得周围人们的帮助。同时，因为视野开阔，所以就能做出正确的判断。为了把工作做得更好，在做判断时，就不能光考虑自己，应该顾及他人，满怀体谅他人的“利他之心”。"]}, {"number": 26, "title": "大胆与细心兼备", "paragraphs": ["大胆与细心这两者看起来相互矛盾，但这两个极端必须同时具备，才能把工作做得完美。", "兼备这两个极端，并不是“中庸”。这好比织成绸缎的丝线，如果把经线比作大胆，那么纬线就是细心，大胆和细心交互使用。因为大胆，就能有力地推动事业向前发展，而同时因为细心，就能防止失败。", "一开始就兼备大胆和细心很不容易。但只见!要在日常工作中，在各种场合下，有意识地磨炼自己，这两个极端就能同时兼备。"]}, {"number": 27, "title": "以“有意注意”磨炼判断力", "paragraphs": ["有目的、有意识地将意识集中，就叫“有意注意”。", "无论何时，无论何种环境下，无论多么细小的事情，都应该用心关注，认真对待。开始时做到这一点也许很困难。但是，只要从平时起，有意识地坚持这么做，“有意注意”就会变成习惯。", "如果能这样，那么在任何状况下，全神贯注于某一现象，这种基本素养就能够掌握，因而不管发生什么问题，都能立即抓佳其核心，很快予以解决。做事不能漫不经心。哪怕是日常生活中微不足道的小事，我们也要养成认真注意的习惯。"]}, {"number": 28, "title": "贯彻公平竞争的精神", "paragraphs": ["京瓷遵循“公平竞争”的原则，堂堂正正地开展经营。因此，“只要赚钱就可以为所欲为”、“少许违反一点规则、少许篡改一些数子，可以容忍”这一类想法，京瓷深恶痛绝。", "在体育界，人们之所以感动，之所以心情舒畅，就是因为比赛基于公平的精神，不允许犯规，不允许违反游戏规则。一旦发现矛盾或违规，不管是谁，都应该勇敢地站出来指正。要让我们的职场始终充满活力，充满清爽的气氛，那么，职场的每个成员不但都应该是公平竞争的选手，而且都要具有裁判员那种严格审视的目光。"]}, {"number": 29, "title": "注重公私分明", "paragraphs": ["工作当中必须严格区分公与私。要严格禁止工作时间内处理私事，严格禁止利用工作之便，接受客户的招待等。此外，要禁止工作时间内拨打或接听私人电话，在工作交往中收到的馈赠物品不可归个人所有，而应该与大家分享。之所以要这样做，是因为即使是轻微做的公私混同，也可能导致道德水准下降，不知不觉中毒害到整个公司。", "我们必须明确区分公私界线，严格自律，对日常的小事也不松懈马虎。"]}, {"number": 30, "title": "怀有渗透到潜意识的、强烈而持久的愿望", "paragraphs": ["要实现高目标，首先，必须怀抱“非实现不可”的强烈而持久的愿望。", "开发新产品，获取客户订单，提高成品率，降低停机率，不管什么课题，首先，“无论如何都要完满实现”这个念头，要在心中强烈地想象、描绘。愿望纯粹而强烈，日思夜想、苦思冥想、反反复复、念念不忘，那么，这种愿望就会渗透到潜意识。一旦进入这种状态，就会与平时有意识的理性思考不同，即使睡觉时，潜意识也会工作，发挥出强大的力量，让愿望朝着实现的方向前进。"]}, {"number": 31, "title": "追求人类的无限可能性", "paragraphs": ["在工作中能够实现新目标的人，是那些相信自己可能性的人。仅以现有的能力判断“行或不行”，就不可能挑战新事物，不可能完成困难的工作，人的能力通过持续努力，可以无限扩展。想做某件事情的时候，首先要相信“人的能力是无限的”，抱着“无论如何必须成功”的强烈愿望，持续不断地付出努力。从零开始的京瓷，成为世界一流的厂商，就有力地证明了这一点。始终相信自己拥有的无限的可能性，鼓足勇气，发起挑战，这种精神非常可贵。"]}, {"number": 32, "title": "勇于挑战", "paragraphs": ["人往往乐于维持现状而不喜变革。但如果只安于现状，不向新事物或困难的事情发起挑战，就意味着已经开始退步。", "所谓挑战，就是制定高目标，在否定现状的同时不断创造新事物。挑战一词听起来似乎勇猛而豪爽，令人振奋，但在它的背后，必须有与困难正面对峙的勇气，必须有不辞任何劳苦的忍耐力，必须付出非凡的努力。正因为不断挑战外人认为不可能做成的难事，才使京瓷成长为一个朝气蓬勃、充满魅力的公司。"]}, {"number": 33, "title": "成为开拓者", "paragraphs": ["做别人不做的事，自己主动开辟谁都没有走过的道，这就是京瓷的历史。开拓无人间津的新领域并非易事，如同在没有航海图和指南针的情况下在茫茫大海中航行一样，能够依靠的只有自己。", "开拓创新伴随着巨大的艰辛，但反过来说，挑战成功时的喜悦，也是其他任何东西都无法替代的。通过开拓无人涉足的领域，就可以展开辉煌的事业。", "不管公司发展到多大的规模，我们都要不断描绘未来的梦想，胸怀强烈的愿望，保持开拓者的进取精神。"]}, {"number": 34, "title": "认为不行的时候，正是工作的开始", "paragraphs": ["成就事业的关键，比才能和能力更为重要的是当事人的热情、激情和执着。要如同甲鱼一般，一旦咬住就决不松口。当你认为不行了的时候，正是工作的真正开始。", "如果拥有强烈的热情和激情，那么，不管是睡着还是醒着，从早到晚，整天都会冥思苦想。这样一来，愿望就会渗透到潜意识，在不知不觉中朝着实现这个愿望的方向前进，使我们走向成功。", "要想成就辉煌的事业，必须有燃烧般的激情和热情，坚韧不拔，奋斗到底，不成功决不罢休。"]}, {"number": 35, "title": "坚持信念", "paragraphs": ["在工作过程中，会遭遇各种各样的障碍。如何克服这些障碍，态度不同，结果也会大相径庭。开展一项新事业，往往会出现反对意见和各种阻力，一遇到这种情况，有人就会轻易放弃。而在工作中取得卓越成就的人，都是把崇高的理想作为信念，击破一切壁障的人。这样的人，把障碍看作考验，与困难正面对峙，迎难而上，高举信念的大旗，奋勇前进。", "坚守信念需要莫大的勇气，缺乏这种勇气，就无法成就创造性的、革新性的事业。"]}, {"number": 36, "title": "乐观构思、悲观计划、乐观实行", "paragraphs": ["想要成就新的事业，首先，要抱有非这样不可的梦想与希望，超乐观地设定目标。这比什么都重要。", "要相信上天赋予我们的无限的可能性，自己对自己说“我行，我一定成功!”自我激励，振奋自己。", "但到了制定计划的阶段，在保持“无论如何必须成功的强烈意志的同时，要悲观地审视构想，要设想到一切可能发生的问题，慎重周密地思考对策。而在实行的阶段，又要抱定”必然成功“的自信，乐观开朗，坚决将计划付诸实施。"]}, {"number": 37, "title": "具备真正的勇气", "paragraphs": ["正确地开展工作需要勇气。平时，我们往往怕得罪人而不敢把该说的话说清楚，不敢把正确的事情以正确的方式贯彻到底。", "要准确无误地把工作向前推进，需要在各个关键时刻都做出正确的决断。在下决断时需要勇气。但是，这里所说的勇气，不是“蛮勇”不是粗野的、所谓豪杰之士的那种勇气。", "真正的勇气，是在贯彻信念的同时，有节度、知畏惧的人，也就是原本谨慎细心的那种人，在经过各种历练之后，所获得的那种勇气。"]}, {"number": 38, "title": "点燃团队的斗志", "paragraphs": ["职场是真刀真枪决胜负的赛场，必须时刻以必胜的信念去面对竞争。", "但是越想取胜，各种各样的困难和压力越会接踵袭来。这时我们往往胆怯，进而放弃初衷，以妥协告终。克服这些困难和压力的动力来自于当事人不屈不挠的斗争心。类似格斗士的那种斗争心，可以冲破一切壁障，引领我们走向胜利。", "无论多么艰难困苦，“决不服输，一定要胜利”—-必须燃起这种激烈的斗志。"]}, {"number": 39, "title": "自己的道路自己开拓", "paragraphs": ["没有人能够保证我们的未来。即使目前公司的业绩优秀，那也是过去努力的结果。谁也无法预见将来会怎样。要使我们的公司在未来保持优秀，持续发展，只能靠我们每个人在各自的岗位上尽心竭力，履行自己应尽的职责。", "不能依赖别人出手相助，不可期待他人为自己排忧解难。首先要认清自己应尽的职责，靠自己的努力把事情办好。必须保持这样的心态。"]}, {"number": 40, "title": "有言实行世间常把“不言实行”（只做不说）当", "paragraphs": ["作美德。而京瓷却强调有言实行", "“（先说再做）。首先，自己主动举手，”这件事我来干“。这就意味着你已经向大家宣布：这件事将以自己为中心展开。一旦公开宣言，来自周围和你自身的双重压力促使你振奋，把你自己逼入非成功不可的境地。兑现承诺的责任，可以确保目标的实现。抓住晨会、会议等所有机会，主动地在众人面前表明自己的想法，说出口的话，在激励自己的同时，还会成为实行的动力。"]}, {"number": 41, "title": "深思熟虑到“看见结果”", "paragraphs": ["我们在工作中，必须达到看见事情结果的心理状态。", "最初只是梦想或者愿望，在大脑中进行认真反复的模拟推演，这样做如何，那样做又如何。不知不觉中，梦想和现实的界限逐渐消失，尚未着手的事情，却感觉到仿佛已经做过，由此逐渐产生一定能做好的自信。这就是所谓“看见结果”的状态。", "只有深思熟虑到这种“看见结果”的状态，才能完成前人从未做过的事业，创造性的事业，或者需要突破重重壁障的极度困难的事业。"]}, {"number": 42, "title": "不成功决不罢休", "paragraphs": ["能否成功，很大程度上取决于当事人的热情和信念，做什么事都不成功的人，就是因为缺乏热情和执着的信念。他们总是寻找适当的借口，自我安慰，然后很快放弃。", "想做成一件事，就要学习狩猎民族捕猎的方法。一旦发现猎物的足迹，就提枪连日追踪，不管狂风暴雨，还是遭遇强敌，也一定要找到猎物的巢穴，不获猎物决不罢休。", "要想成功，就必须朝着既定的目标，孜孜以求，坚忍不拔，不成功决不罢休。"]}, {"number": 43, "title": "人生·工作的结果=思维方式*热情*能力", "paragraphs": ["人生，工作的结果由思维方式、热情、能力这三个要素的乘积决定。其中，能力和热情，分别可以以零分打到小地 开修读本一百分，因为是相乘的关系，所以与自以为能力强、骄傲自满、不肯努力的人相比，那些认为自己能力平平，但比任何人都努力的人，反而能够取得更出色的成果。在这之上，再乘上思维方式，所谓“思维方式”就是人生态度，可以从负100分到正100分，思维方式不同，人生和工作的结果就会发生一百八十度的转变。能力与努力固然重要，但最重要的是：具备作为人应该有的正确的思维方式。"]}, {"number": 44, "title": "认认真真地过好每一天", "paragraphs": ["人生如戏，每个人都是自己戏中的主角。重要的是如何创作自己人生的剧本。", "或许存在任由命运摆布的人生，但是通过塑造自己的心灵、改变自己的精神，人就能按照自己的理想创作剧本，按照自己的理想扮演戏中的主角。所谓人生，全在自己如何描绘。浑浑噩噩生活的人和认真对待生活的人，其剧本的内容截然不同京瓷哲学——共修读本", "珍视自己，一天一天，一瞬间一瞬间，极度认真地过好，你的人生即刻就会呈现灿烂的景象。"]}, {"number": 45, "title": "心想事成", "paragraphs": ["事情的结果由心中如何描绘而定。如", "果心里总是思考“无论如何都要成功”，那就一定能够成功；“可能不行，也许会失败”，这种想法占据内心时就会失败。", "内心没有呼唤过的东西，不会自动来到自己身边，现在自己周围发生的所有的现象都不过是自己内心的反映。所以我们心里不应该有愤怒、憎恨、嫉妒、猜疑等，不要在心里描绘那些带有否定性的、阴暗的东西，而应该时常抱有梦想，在心里描绘积极的、美丽的事物。只要这样做，实际的人生就会变得美好。"]}, {"number": 46, "title": "描绘梦想", "paragraphs": ["现实很严峻，或许度过今天一天都很难。但是，就在这严峻的现实中，面对未来，能否描绘出梦想，将会决定我们的人生。对于自己的人生和事业，“希望自己成为这样的人”“希望自己做成那样的事”。就是说，具备一个很大的梦想、树立一个很高的目标，这点很重要。", "京瓷从创业开始就提出：“首先是西京区第一，接着是京都第一，再接下来是日本第一、世界第一。”不断描绘这个梦想，并持续付出相应的努力，这才有了今天的京瓷。", "描绘远大而美好的梦想，用一生来追求这样的梦想。这就体现了人生的价值，人生也会因此幸福快乐。"]}, {"number": 47, "title": "动机至善，私心了无", "paragraphs": ["描绘远大梦想并付诸实施时，必须问一问自己“动机善否”?通过自问自答来判断自己动机的善恶。所谓善，就是普遍认为好，所谓普遍，就是无论由谁来看，都认为是好事。因此，不是只符合自己的利益、方便和形象就可以，而必须是自己和他人都能接受的。另外，在工作过程中，还要自问”私心有无?“必须审视自己的内心，在工作中防止以自我为中心。动机至善，又无私心，那就不必追问结果，结果必定是成功。"]}, {"number": 48, "title": "抱纯粹之心，走人生之路", "paragraphs": ["古印度的梵文中留下一位圣人的话语：“伟人的行动之所以成功，与其说凭借其行动的手段，不如说凭借他心灵的纯粹。”所谓纯粹之心，换句话说，就是做事的动机纯粹，没有私心。", "这与“作为人，何谓正确”的说法是一样的道理。只要抱有纯粹之心，我们就会走上一条正确的人生道路。纯粹而没有私心，就是具备了做人的很高的见识，具备了深刻的见解。用纯粹之心作为判断的基准，做出决定，度过人生，那么，他的人生一定顺畅，硕果累累。"]}, {"number": 49, "title": "小善乃大恶", "paragraphs": ["人际关系的基本要点是：要抱着爱心与人相处。但那不是盲目的爱，也不是溺爱。", "上司和部下的关系也一样。上司敏之信念，只知迎合部下，不严格要求，看上去很有爱心，结果却是書了部下。这就叫小善。有何请说“小善乃大恶”，意思是表面的爱会导致对方的不幸。", "相反，抱有信念、对部下严格指导的上司，可能会令人感到不够亲切，但是从长远来看却能培养部下，促使其成长，这就是大善。真正的爱，是指无论何事，都要认真想清楚是否确实有利于对方。"]}, {"number": 50, "title": "人生须时时反省", "paragraphs": ["要想提升自我，就一定要严于律己，经常谦虚地、深刻地反省自己：“自己日常的判断和行动是不是符合正确的做人原则?自己有没有骄傲的情绪?”", "要回归真我，“不可做卑鄙的事情”“不能有卑怯的行”。只要反复这样的自我反省，就不会犯大的错误。", "在每天忙碌的生活中，我们很容易迷失自我。因此，必须有意识地养成自我反省的习惯。这样做，就能够改正自己的缺点和错误，提升自我。"]}, {"number": 51, "title": "以心为本的经营", "paragraphs": ["京瓷公司是从一个既没有资金，也没有信誉和业绩的街道小工厂起步的。当时，它依靠的只是仅有的一点技术，以及相互依赖的28名员工。", "为了公司的发展，每个人都竭尽全力。经营者也不负众望，拼命工作。员工们相互信任，不贪图私利私欲。大家都以在这个公司工作力荣，盼公司发展壮大。常言说，人心易变，但同时，比人心更坚固的东西并不存在。正因为大家心心相连，才有了京瓷今天的发展。"]}, {"number": 52, "title": "光明正大地追求利润", "paragraphs": ["企业如果没有利润就无法生存。追求利润既不是可耻的事，也不违背做人的原则。在自由经济的市场环境中，由竞争结果决定的价格就是合理的价格，以这个价格堂堂正正地做生意所赚得的利润，就是正当的利润。在激烈的价格竞争中，努力推进合理化，提高附加价值，才能增加利润。不是为了满足顾客的要求脚踏实地、努力工作，而是靠投机和不正当手段牟取暴利，梦想一攫千金。在这样的世风中，光明正大地开展事业，追求正当的利润，为社会多做贡献，这就是京瓷的经营之道。"]}, {"number": 53, "title": "遵循原理原则", "paragraphs": ["京瓷自创建以来，所有的事情都是在遵循原理原则的前提下做出决断的。公司的经营应该合乎情理，遵循道德。否则，经营就不可能顺利进行，更不可能长期发展。", "我们并不依赖所谓的经营常识。比如说，“因为一般的公司都这样做，所以…”我们不会依据这类常识做出轻率的判断。", "无论是组织、财务还是利润的分配，如果认识到事情本来应该怎样，以事物的本质为依据做出判断，那么、即使是在国外，即使面对至今未曾遇到过的新的经济状况，判断也不会失误。"]}, {"number": 54, "title": "贯彻顾客至上主义京瓷创业之初，是生产零部件的厂", "paragraphs": ["家，但自那时起，京瓷就不是从属于他人的下包加工企业，而是一家独立自主的公司。", "所谓独立自主，就是要不断创造出客户期待的有价值的产品。因此，在相关领域里，必须拥有比其他厂家更为先进的技术。必须凭借先进的技术，在交货期、质量、价格、新产品开发等所有环节上，全方位地满足客户的需求。", "这就要求我们颠覆固有观念，采取挑战到底的姿态。取悦客户是从商之本，做不到这一点，就不可能持续获得利润。"]}, {"number": 55, "title": "以大家族主义开展经营", "paragraphs": ["把别人的快乐当作自己的快乐，同甘共苦，我们一贯重视这种家族式的信赖关系。这是京瓷员工携手并进的出发点。", "这种家族式的关系，使员工们互存感谢之心，相互体谅，建立起彼此信赖的关系，成为做好工作的基础。正因为像家族一样，当同事在工作上遇到困难的时候，就能够无条件地互相帮助，甚至个人的私事也能像家人那样相互交谈。", "我们所说的“以心为本的经营”，也可以说，就是指重视这种家族式关系的经营。"]}, {"number": 56, "title": "贯彻实力主义", "paragraphs": ["运营一个组织最重要的是，这个组织各部门负责人是否由真正有实力的人来担任。", "真正有实力的人，不仅拥有胜任职务的能力，同时具备高尚的人格，值得信任，值得尊敬，愿意为众人的利益发挥自己的能力。要给这样的人提供出任组织负责人的机会，并让他们充分施展才能，一定要形成这样的组织氛围。贯彻实力主义，组织就会得到强化，进而达到为全体员工谋福利的目的。在京瓷公司，衡量一个人的标准，不是辈分和资历，而是他所具备的真正实力。"]}, {"number": 57, "title": "重视伙伴关系", "paragraphs": ["京瓷自创立以来，一直致力于建立心心相印、互相信赖的伙伴关系，并以此为基础开展工作。", "公司同事间的关系，不是经营者与员工之间的那种纵向的从属关系，基本上是横向的伙伴关系，是同志关系。大家朝着一个目标一起行动，为实现共同的理想团结奋斗。", "不是通常那种基于权力或权威的上下级关系，而是志同道合的伙伴们团结一致，齐心协力，这才带来了京瓷今日的发展。", "合作伙伴之间互相理解、互相信赖，才使这一切成为可能。"]}, {"number": 58, "title": "全员参与经营", "paragraphs": ["在京瓷，我们把阿米巴组织作为经营单位。每个阿米巴都独立自主地开展经营。同时，每个人都可以发表自己的意见，为经营出谋献策，并参与制订经营计划。这里的关键在于不是少数人而是全体员工共同参与经营。", "当每个员工都通过参与经营得以实现自我，全体员工齐心协力朝着同一个目标努力的时候，团队的目标就能实现。", "全员参与的精神，也适用于公司活动和聚会。为了培养开放式的人际关系、伙伴意识、家族意识，我们经常举办各种活动，并同工作一样，要求全员参与。"]}, {"number": 59, "title": "统一方向，形成合力", "paragraphs": ["人总是有各种不同的想法，如果每个员工都各行其是，公司将会怎样呢?每个人的力量不能凝聚到同一个方向，力量势必分散，就无法形成公司的合力。看看棒球或者足球之类团体性比赛就会发现，全体队员向着获胜的目标齐心协力的团队，同那些各自为战、只追逐个人目标的团队之间，实力的差距一目了然。", "当全体员工的力量向着同一个方向凝聚在一起的时候，就会产生成倍的力量，创造出惊人的成果。那时一加一就会等于五，甚至等于十。"]}, {"number": 60, "title": "重视独创性", "paragraphs": ["京瓷自创业之时，就非常重视独创性，从不模仿他人，一直凭借独特的技术与对手一决胜负。其他公司不敢接手的订单，我们欣然接受，之后全体员工拼命努力，创造出这种产品。随之也就确立并积蓄了一项项独创性的技术。譬如，京瓷曾获得过大河内纪念生产特别奖、科学技术厅长官奖等奖项，特别是多层封装技术的开发成功，更有力地证明了这一点。这项技术为京瓷飞跃性的发展带来了机会。抱着无论如何也要成功的强烈的使命感，每天钻研创新，一步一步积累，必将孕育出卓越的发明创造。"]}, {"number": 61, "title": "玻璃般透明的经营", "paragraphs": ["京瓷以信赖关系为基础开展经营，包括会计在内的所有业务全部公开，形成了毋庸置疑的体系。", "举例来说，按照“单位时间核算制", "度”，所有部门的经营业绩都向全体", "员工公开。自己的阿米巴组织的利润是多少，具体内容如何，任何人都可以轻易了解。另一方面，每个人也都敞开心扉，在工作上追求公开性。公司内部如同玻璃般透明开放，我们就能把全部精力投入到工作中去。"]}, {"number": 62, "title": "树立高目标", "paragraphs": ["创业之初，京瓷的厂房是租来的，员工不足百人。但从那时起，我就提出“京瓷要放眼全球，向着全世界的京瓷前进”。公司虽小，却把目光投向世界，这就是树立高目标，树立远大的目标。", "只有设定高目标的人，才能取得伟大的成功。只追求低目标的人，只能得到渺小的结果。如果自己设定了远大的目标，只要朝着这个目标全神贯注、全力以赴，就能走向成功。只有胸怀大志，乐观开朗，描绘宏伟的蓝图，树立远大的目标，才能成就难以想象的伟大事业。"]}, {"number": 63, "title": "定价即经营", "paragraphs": ["定价关乎经营的死活。在制定价格时，是薄利多销还是厚利少销，可以说定价有无数种选择。", "决定了一定的利润率后，销售量能达到多少，能创造多少利润，预测非常困难。", "经营者必须在正确认识自己产品价值的基础上，找到销售量与利润率的乘积的最大点。", "而且这一点必须是客户和京瓷双方都乐于接受的价格。为了找出这个点，定价时必须深思熟虑。《京瓷哲学七十八条》·稻盛和夫"]}, {"number": 64, "title": "销售最大化，费用最小化 （量入为出）", "paragraphs": ["企业经营其实非常简单。只需致力于如何扩大销售额，如何缩小费用。利润就是销售额与费用的差额，利润不过是结果。因此，我们只要不断思考如何“销售最大化，费用最小化”这一点就行了。", "所以，我们不可拘泥于常识和固定观念，比如“材料费”应当占“总产值”的百分之儿，“促销费”必须花多少，等等。", "为了实现销售最大化、费用最小化这个目标，必须每天钻研创新，坚韧不拔，努力再努力，这是十分重要的。"]}, {"number": 65, "title": "每天都进行核算", "paragraphs": ["经营企业、不能只看月底做出的核算表。月度核算表是细小数字的累积，是根据每天的销售额和经费的累计，计算出来的。我们必须意识到一个月的核算结果是每天核算的积累。在经营中，如果不看每一天的数字，就像不看仪表盘驾驶飞机一样，不知道飞机飞往何处，在哪里着陆。同样，不看每天的经营数字，就不可能达成经营目标。", "不可忘记，核算表是每一个人、每一天的工作积累的结果。"]}, {"number": 66, "title": "贯彻健全资产原则", "paragraphs": ["京瓷严格防止不良资产的产生。在必要的时候，买进必要的原料，生产必要的产品，这是原则。购买了多余的东西，或者生产了过剩的产品，就会出现不良库存，浪费不必要的经费。而万一出现了不良资产，就要立即处理。这虽然会造成一时的损失，但不要顾忌眼前的数字，要拿出勇气，坚决把不良资产处理掉。", "如果不这样做，将问题搁置，只会带来更大的损失。一定要坚持在健全的资产状态下经营企业。"]}, {"number": 67, "title": "能力要用将来进行时", "paragraphs": ["制定新目标时，要敢于将这个目标设定在自己的能力之上。现在被认为无法实现的高目标，在将来的某一时点定能实现，据此设定目标。", "同时，为了在设定的时点达成目标，必须考虑提升自己现有能力的方法。仅凭现有的能力，谁都能断言能做或不能做。但是，不提高现有的能力，就不可能完成新的工作，不可能实现更高的目标。", "现在虽然做不到，但到时无论如何也要做到，只有这种态度才能达成高目标。"]}, {"number": 68, "title": "目标要众所周知，彻底贯彻", "paragraphs": ["为了达成目标，一定要让全体员工都知晓这个目标，并彻底贯彻。也就是说，这个目标要为全员所共有，大家都把这目标当作自己的东西。", "不论是销售部门，还是生产部门，当月的“销售额”“生产总值”“附加值”“单位时间附加值”", "等这类数字，一定要装进全体员工的头脑里，在车间里、职场里，不论问谁，都能马上脱口说出。", "在京瓷的“阿米巴经营”和“单位时间核算制度”里，由于全员知晓目标、共有并贯彻目标，这样就提高了每一个人的参与意识，从而形成齐心协力实现目标的巨大能量。"]}, {"number": 69, "title": "提高核算意识", "paragraphs": ["京瓷以阿米巴为单位实行“单位时间核算制度”。这样，谁都可以清楚地了解部门的工作成果，每一位员工都必须具备经营者意识，都必须认真思考如何提高自己所属的阿米巴的“单位时间效益”，并付诸实践。", "平时，我们强调即使是一支铅笔、一枚别针也不能忽略，爱惜物品，就是上述核算意识的体现。散落在地上的原料，堆积在车间角落里的不良品都是金钱。我们必须把核算意识提高到这样的水平。"]}, {"number": 70, "title": "以节俭为本", "paragraphs": ["公司业绩比较好的时候，我们往往容易放松对经费的控制，觉得“花一点小钱无所谓”或“不必那么小里小气的”。这样一来，各部门的浪费累积起来，就会极大地影响整个公司的利益。", "一旦养成了自我放松的习惯，当形势变得严峻时，即使想要紧缩经费，也很难恢复到原有的状态。因此，无论在什么情况下，我们都必须注意节俭。把经费压缩到最小限度，可以说这是我们参与经营最贴近的方式。"]}, {"number": 71, "title": "按所需数量购买所需物品", "paragraphs": ["在购买物品和原材料的时候，因为大量购入能降低单价，于是，轻率地购进超出需要的东西，这是不应该的。买得过多会造成使用上的浪费。即使一时以便宜的价格大量购人，但因此需要保管的仓库，需要支付库存的利息，这样就增加了额外的支出。而且，由于产品规格变更等原因，买进的材料会变得根本无法使用，这就很危险。", "总之，厂家就是厂家，应专注于制造本身，要靠制造获取利润。只在必要之时购进必要数量的物品，这一点非常重要。"]}, {"number": 72, "title": "贯彻现场主义", "paragraphs": ["物品制造的原点在生产现场；销售的原点是同客户接触。", "出现间题时，首先需要回到现场。脱离现场，在办公桌旁煞费苦心，空谈理论，绝对解决不了问题。", "人们常说，“现场是座宝山”，现场蕴含着第一手信息，这是解决问题的关键。经常去现场，不仅可以找到解决问题的线索，而且可以获得意外的启示，借此提高生产效率，提高产品质量，或者得到新的客户订单。现场主义不仅适合于生产和销售部门，而且适用于一切部门。"]}, {"number": 73, "title": "重视经验", "paragraphs": ["在企业从事技术开发和产品制造。经验不可或缺。仅有理论是远远不够的。", "以陶瓷为例，把原料的粉未搅拌混合，然后成型。再经高温烧结后完成。这一点只要学习，谁都能理解。可是，粉末的搅拌混合究竟是怎么一回事，不亲手操作，不经过辛苦体验，是绝对领会不到的。如果是液体或气体，当然可以充分混合，可是粉未状的固体，究竟要搅拌到何种程度，才能称之为完全混合呢?这一点只有通过经验才能体会到。", "只有将经验与理论结合起来，才能够完成杰出的技术开发和产品制造。"]}, {"number": 74, "title": "制造完美无瑕的产品", "paragraphs": ["我们所制造的产品，必须是“完美无瑕的产品”。就像崭新的钞票一样，看上去就能让人感觉到锋利，手感舒服。", "产品能够反映出制作者的心地。心地粗糙的人制造出来的东西是粗糙的，心地细腻的人制造出来的东西是细腻的。制造大量的产品，再从中选出合格品，抱这种想法，就不可能制作出令客户满意的产品。", "产品的生产工艺完美无缺，在此基础上，全员集中精神、认真操作，不允许出现一个不良品。目标必须是每一个产品都完美无瑕。"]}, {"number": 75, "title": "倾听产品的声音", "paragraphs": ["当出现问题或是工作陷人困境时，应该认真地、虚心地对相关事物和现象进行连续观察。", "例如，在生产现场，用尽一切办法，材料利用率仍然提不高，我们经常会碰到这类障碍。这时候，应该从产品、机器到原材料、工爽具、观察整个工序中的每一个细节，用真诚的目光认真注视有关的现象。如果存在不良品或有维护不当的机器，我们就能听到它们的“哭泣声”。", "产品自身会告诉我们解决问题的线索。不抱成见、偏见，谦虚地观察事物的真实状态，这一点十分重要。"]}, {"number": 76, "title": "贯彻——对应原则", "paragraphs": ["在处理事务时，不能笼统记账，必须逐一明确，对应处理。比如，在没有票据的情况下运用现金或物品；或者在没有对现金或物品进行确认的情况下，进行票据处理。这些做法都是不允许的。", "再比如，应收款的人帐确认，必须弄清楚是哪一笔销售的款项，入帐了多少。要将其分别——对应起来进行核销。", "另外，在生产活动和销售活动中也一样，要把“总生产值”“总收益”这类收益性指标和产生收益所花的经费正确地对应起来，进行严格的核算管理。"]}, {"number": 77, "title": "贯彻双重确认的原则", "paragraphs": ["凡是人都难免会出差错。还有一种情况，就是明知不对，却因鬼迷心窍而干起了舞弊的勾当。", "为了防止差错和不当行为，有必要建立由多部门、多人复核的双重确认的体制。比如，购人物品时，要经收货部门和验货部门这两个部门的确认。盖公章时，要经过盖章人和保管人的多重确认。计算数字时，需要两个人验算等。", "这些都是有代表性的例子。尤其是有关金钱和物品的管理，一定要彻底贯彻双重确认的原则，建立起防患于未然的体制，杜绝差错与舞弊行为的发生。"]}, {"number": 78, "title": "要把事情简单化", "paragraphs": ["我们往往有一种倾向，就是把事情考虑得过于复杂。但是，为了把握事物的本质，有必要把复杂现象简单化。把事情看得越简单，就越接近事物的本来面目，也就是说，越接近真理。例如，看起来很复杂的经营，说到底，只不过是彻底追求“销售最大化和经费最小化“这样一个简单的原则而已。京瓷的“单位时间核算制度”，其基础就是“把事情简单化”这种思维方式。尽力去把复杂现象简单化，这种思维方式，这一考虑问题的出发点非常重要。"]}];
    const numberElement = document.getElementById("chapter-number");
    const titleElement = document.getElementById("chapter-title");
    const contentElement = document.getElementById("chapter-content");
    const countElement = document.getElementById("page-count");
    const previousButton = document.getElementById("previous");
    const nextButton = document.getElementById("next");
    let activeIndex = 0;
    let touchStartX = 0;

    function requestedIndex() {
      const value = Number.parseInt(window.location.hash.slice(1), 10);
      if (Number.isInteger(value) && value >= 1 && value <= chapters.length) return value - 1;
      const savedValue = Number.parseInt(window.localStorage.getItem("kyocera-philosophy-chapter"), 10);
      return Number.isInteger(savedValue) && savedValue >= 1 && savedValue <= chapters.length ? savedValue - 1 : 0;
    }

    function showChapter(index, updateAddress = true) {
      activeIndex = Math.max(0, Math.min(index, chapters.length - 1));
      const chapter = chapters[activeIndex];
      numberElement.textContent = `第 ${chapter.number} 条`;
      titleElement.textContent = chapter.title;
      contentElement.replaceChildren(...chapter.paragraphs.map((paragraph) => {
        const item = document.createElement("p");
        item.textContent = paragraph;
        return item;
      }));
      contentElement.scrollTop = 0;
      countElement.textContent = `第 ${chapter.number} 条，共 ${chapters.length} 条`;
      previousButton.disabled = activeIndex === 0;
      nextButton.disabled = activeIndex === chapters.length - 1;
      window.localStorage.setItem("kyocera-philosophy-chapter", String(chapter.number));
      if (updateAddress) window.location.hash = String(chapter.number);
    }

    function move(offset) { showChapter(activeIndex + offset); }

    previousButton.addEventListener("click", () => move(-1));
    nextButton.addEventListener("click", () => move(1));
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") move(-1);
      if (event.key === "ArrowRight" || event.key === "ArrowDown") move(1);
    });
    document.addEventListener("touchstart", (event) => { touchStartX = event.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener("touchend", (event) => {
      const distance = event.changedTouches[0].screenX - touchStartX;
      if (Math.abs(distance) < 48) return;
      move(distance < 0 ? 1 : -1);
    }, { passive: true });
    window.addEventListener("hashchange", () => showChapter(requestedIndex(), false));
    showChapter(requestedIndex(), false);
  </script>
</body>
</html>
